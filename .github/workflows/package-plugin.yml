name: Package BrewPilot local plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "tests/**"
      - "package.json"
      - "README.md"
      - "mcp.json"
      - ".mcp.json"
      - "plugin.json"
      - ".codex-plugin/plugin.json"
      - "skills/**"
      - ".github/workflows/package-plugin.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify local source
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Assemble plugin package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          STAGE="$ROOT/dist/plugin"
          mkdir -p "$STAGE/server/core" "$STAGE/server/bridge" "$STAGE/server/platform" "$STAGE/tests" "$STAGE/skills/browser-automation" "$STAGE/.codex-plugin"
          cp package.json README.md mcp.json .mcp.json plugin.json "$STAGE/"
          cp .codex-plugin/plugin.json "$STAGE/.codex-plugin/plugin.json"
          cp skills/browser-automation/SKILL.md "$STAGE/skills/browser-automation/SKILL.md"
          cp server/index.mjs "$STAGE/server/index.mjs"
          cp server/core/*.mjs "$STAGE/server/core/"
          cp server/bridge/*.mjs "$STAGE/server/bridge/"
          cp server/platform/*.mjs "$STAGE/server/platform/"
          cp tests/*.test.mjs "$STAGE/tests/"
          cd "$STAGE"
          npm test
          zip -qr "$ROOT/dist/brewpilot-local-plugin-update.zip" .
          cd "$ROOT/dist"
          sha256sum brewpilot-local-plugin-update.zip > SHA256SUMS
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: brewpilot-local-plugin-0.3.2
          path: |
            dist/brewpilot-local-plugin-update.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
